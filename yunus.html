<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Men’s Güzellik Salonu - Randevu & Cari Takip</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --card-border: #1e293b;
            --accent-platinum: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --warning-color: #fbbf24;
            --whatsapp-color: #25d366;
            --call-color: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

        header {
            background: linear-gradient(135deg, #131b2e, #0b0f19);
            border-bottom: 2px solid var(--accent-platinum);
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        header h1 { font-size: 1.4rem; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        header p { font-size: 0.8rem; color: var(--accent-platinum); font-weight: 700; margin-top: 3px; }

        .container { max-width: 600px; margin: 15px auto; padding: 0 12px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 11px; background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-muted); font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
        }
        .tab-btn.active { background: var(--accent-platinum); color: #0b0f19; border-color: var(--accent-platinum); font-weight: 800; }

        .card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 16px; margin-bottom: 15px; box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .stat-box { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 6px; text-align: center; }
        .stat-box span { display: block; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 3px; }
        .stat-box strong { font-size: 0.88rem; font-weight: 900; color: #fff; }

        .form-group { margin-bottom: 10px; text-align: left; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
        .form-control {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border);
            background: #0b0f19; color: white; font-size: 0.9rem;
        }
        .form-control:focus { outline: none; border-color: var(--accent-platinum); box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }

        .quick-clients { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
        .quick-chip {
            background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent-platinum); color: var(--accent-platinum);
            padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s;
        }
        .quick-chip:hover { background: var(--accent-platinum); color: #0b0f19; }
        .quick-chip .delete-chip { color: var(--danger-color); font-size: 0.7rem; }
        .quick-chip:hover .delete-chip { color: #0b0f19; }

        .btn-primary {
            width: 100%; padding: 12px; background: var(--accent-platinum); color: #0b0f19; font-weight: 800;
            border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; margin-top: 5px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); transition: 0.2s;
        }
        .btn-primary:hover { background: var(--accent-hover); }

        .next-customer-banner {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(16, 185, 129, 0.15));
            border: 1px solid var(--accent-platinum); border-radius: 10px; padding: 12px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .next-info h5 { font-size: 0.75rem; color: var(--accent-platinum); text-transform: uppercase; font-weight: 800; margin-bottom: 2px; }
        .next-info p { font-size: 0.9rem; font-weight: 700; color: #fff; }

        .list-item {
            background: rgba(11, 15, 25, 0.75); border: 1px solid var(--card-border); border-radius: 9px;
            padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .item-info h4 { font-size: 0.95rem; color: #fff; font-weight: 800; margin-bottom: 2px; }
        .item-info p { font-size: 0.78rem; color: var(--text-muted); }
        .item-actions { display: flex; gap: 5px; align-items: center; }

        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success-color); border: 1px solid var(--success-color); }
        .badge-danger { background: rgba(244, 63, 94, 0.2); color: var(--danger-color); border: 1px solid var(--danger-color); }

        .btn-action { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); cursor: pointer; font-size: 0.85rem; width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; transition: 0.2s; }
        .btn-delete { color: var(--danger-color); }
        .btn-delete:hover { background: rgba(244, 63, 94, 0.2); }
        .btn-check { color: var(--success-color); }
        .btn-check:hover { background: rgba(16, 185, 129, 0.2); }
        .btn-edit { color: var(--warning-color); }
        .btn-edit:hover { background: rgba(251, 191, 36, 0.2); }
        .btn-whatsapp { color: var(--whatsapp-color); }
        .btn-whatsapp:hover { background: rgba(37, 211, 102, 0.2); }
        .btn-call { color: var(--call-color); }
        .btn-call:hover { background: rgba(59, 130, 246, 0.2); }
        .btn-manage { color: var(--accent-platinum); }
        .btn-manage:hover { background: rgba(56, 189, 248, 0.2); }

        .section-title { font-size: 0.95rem; font-weight: 800; color: var(--accent-platinum); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>💈 Men’s Güzellik Salonu</h1>
        <p>✂️ İşletmeci: Yunus Erbay | 🪒 Profesyonel Bakım</p>
    </header>

    <div class="container">
        <!-- Sekmeler -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('randevuTab', this)"><i class="fa-solid fa-calendar-check"></i> Randevular</button>
            <button class="tab-btn" onclick="switchTab('cariTab', this)"><i class="fa-solid fa-wallet"></i> Cari & Kasa</button>
        </div>

        <!-- 1. RANDEVU SEKMESİ -->
        <div id="randevuTab">
            <div id="nextCustomerBanner" class="hidden">
                <div class="next-customer-banner">
                    <div class="next-info">
                        <h5>🔥 Sıradaki / Yaklaşan Müşteri</h5>
                        <p id="nextCustomerText">-</p>
                    </div>
                    <i class="fa-solid fa-user-clock" style="font-size: 1.5rem; color: var(--accent-platinum);"></i>
                </div>
            </div>

            <div class="card">
                <div class="section-title"><i class="fa-solid fa-plus-circle"></i> <span id="randevuFormTitle">Yeni Randevu Oluştur</span></div>
                <input type="hidden" id="editingRandevuId" value="">
                
                <!-- Hızlı Sabit Müşteri Seçimi ve Ekleme Alanı -->
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                        <label style="margin:0;">⚡ Hızlı Müşteri Listesi</label>
                        <button type="button" onclick="addQuickClientPrompt()" style="background:none; border:none; color:var(--accent-platinum); font-size:0.75rem; font-weight:700; cursor:pointer;"><i class="fa-solid fa-plus"></i> Bu Müşteriyi Hızlıya Ekle</button>
                    </div>
                    <div class="quick-clients" id="quickClientsContainer">
                        <!-- Dinamik Yüklenecek -->
                    </div>
                </div>

                <div class="form-group">
                    <label>Müşteri Adı Soyadı</label>
                    <input type="text" id="rMusteri" class="form-control" placeholder="Örn: Tamer Çelebi">
                </div>
                <div class="form-group">
                    <label>Telefon Numarası</label>
                    <input type="tel" id="rTelefon" class="form-control" placeholder="Örn: 05513981992">
                </div>
                <div class="form-group">
                    <label>Yapılacak İşlem</label>
                    <input type="text" id="rIslem" class="form-control" placeholder="Örn: ✂️ Saç + Sakal Kesimi">
                </div>
                <div class="form-group">
                    <label>Tarih ve Saat</label>
                    <input type="datetime-local" id="rTarih" class="form-control">
                </div>
                <button class="btn-primary" id="randevuSaveBtn" onclick="saveRandevu()">Randevuyu Kaydet</button>
            </div>

            <div class="card">
                <div class="section-title"><i class="fa-solid fa-list"></i> Randevu Takvimi</div>
                <div id="randevuListContainer"></div>
            </div>
        </div>

        <!-- 2. CARİ / KASA SEKMESİ -->
        <div id="cariTab" class="hidden">
            <div class="stats-grid">
                <div class="stat-box">
                    <span>Toplam Alacak</span>
                    <strong id="statBorc" style="color: var(--danger-color);">₺0,00</strong>
                </div>
                <div class="stat-box">
                    <span>Tahsil Edilen</span>
                    <strong id="statTahsil" style="color: var(--success-color);">₺0,00</strong>
                </div>
                <div class="stat-box">
                    <span>Toplam Ciro</span>
                    <strong id="statCiro" style="color: var(--accent-platinum);">₺0,00</strong>
                </div>
            </div>

            <div class="card">
                <div class="section-title"><i class="fa-solid fa-user-plus"></i> Cari / Veresiye Müşteri Ekle</div>
                <div class="form-group">
                    <label>Müşteri Adı</label>
                    <input type="text" id="cMusteri" class="form-control" placeholder="Örn: Mehmet Demir">
                </div>
                <div class="form-group">
                    <label>Telefon Numarası</label>
                    <input type="tel" id="cTelefon" class="form-control" placeholder="Örn: 05321234567">
                </div>
                <div class="form-group">
                    <label>İlk İşlem / Borç Tutarı (TL)</label>
                    <input type="number" id="cBakiye" class="form-control" placeholder="Örn: 350">
                </div>
                <button class="btn-primary" style="background: var(--success-color); color: #fff;" onclick="addCari()">Cari Hesaba Ekle</button>
            </div>

            <div class="card">
                <div class="section-title"><i class="fa-solid fa-file-invoice-dollar"></i> Cari Hesap Defteri</div>
                <div id="cariListContainer"></div>
            </div>
        </div>
    </div>

    <script>
        let randevular = JSON.parse(localStorage.getItem('yunus_randevular')) || [];
        let cariler = JSON.parse(localStorage.getItem('yunus_cariler')) || [];
        let quickClients = JSON.parse(localStorage.getItem('yunus_quick_clients')) || [
            { name: 'Tamer Çelebi', phone: '05513981992', islem: '✂️ Saç + Sakal' },
            { name: 'Ahmet Yılmaz', phone: '05320000000', islem: '✂️ Saç Kesimi' }
        ];

        function switchTab(tabId, btn) {
            document.getElementById('randevuTab').classList.add('hidden');
            document.getElementById('cariTab').classList.add('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.remove('hidden');
            btn.classList.add('active');
        }

        // --- HIZLI MÜŞTERİ YÖNETİMİ ---
        function renderQuickClients() {
            const container = document.getElementById('quickClientsContainer');
            container.innerHTML = '';
            quickClients.forEach((qc, index) => {
                const chip = document.createElement('div');
                chip.className = 'quick-chip';
                chip.innerHTML = `<span onclick="fillClient('${qc.name}', '${qc.phone}', '${qc.islem}')"><i class="fa-solid fa-user"></i> ${qc.name}</span> <i class="fa-solid fa-xmark delete-chip" onclick="removeQuickClient(${index})" title="Hızlı listeden sil"></i>`;
                container.appendChild(chip);
            });
        }

        function fillClient(isim, tel, islem) {
            document.getElementById('rMusteri').value = isim;
            document.getElementById('rTelefon').value = tel;
            document.getElementById('rIslem').value = islem;
        }

        function addQuickClientPrompt() {
            const name = document.getElementById('rMusteri').value.trim();
            const phone = document.getElementById('rTelefon').value.trim();
            const islem = document.getElementById('rIslem').value.trim();

            if(!name) {
                alert('Önce formdan müşteri adı girin, sonra hızlıya ekleyin!');
                return;
            }
            if(!quickClients.some(x => x.name.toLowerCase() === name.toLowerCase())) {
                quickClients.push({ name, phone, islem });
                localStorage.setItem('yunus_quick_clients', JSON.stringify(quickClients));
                renderQuickClients();
                alert(`${name} hızlı müşteri listesine eklendi!`);
            } else {
                alert('Bu müşteri zaten hızlı listede kayıtlı.');
            }
        }

        function removeQuickClient(index) {
            quickClients.splice(index, 1);
            localStorage.setItem('yunus_quick_clients', JSON.stringify(quickClients));
            renderQuickClients();
        }

        // --- TEK SEFERLİK BİLDİRİM KONTROLÜ ---
        function checkNotifications() {
            if (!("Notification" in window)) return;
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            const now = new Date().getTime();
            let guncellendi = false;

            randevular.forEach(r => {
                const rTime = new Date(r.tarih).getTime();
                if (r.durum === 'Bekliyor' && !r.bildirimGonderildi && rTime <= now && rTime > (now - 15 * 60 * 1000)) {
                    if (Notification.permission === "granted") {
                        new Notification("💈 Men’s Güzellik Salonu - Randevu Vakti!", {
                            body: `${r.musteri} için ${r.islem} randevusu başladı!`,
                            icon: "https://cdn-icons-png.flaticon.com/512/2933/2933888.png"
                        });
                    }
                    r.bildirimGonderildi = true;
                    guncellendi = true;
                }
            });

            if (guncellendi) {
                localStorage.setItem('yunus_randevular', JSON.stringify(randevular));
            }
        }
        setInterval(checkNotifications, 20000);

        // --- RANDEVU İŞLEMLERİ ---
        function saveRandevu() {
            const musteri = document.getElementById('rMusteri').value.trim();
            const telefon = document.getElementById('rTelefon').value.trim();
            const islem = document.getElementById('rIslem').value.trim();
            const tarih = document.getElementById('rTarih').value;
            const editingId = document.getElementById('editingRandevuId').value;

            if(!musteri || !islem || !tarih) {
                alert('Lütfen ad, işlem ve tarih alanlarını doldurun!');
                return;
            }

            const cakisma = randevular.find(x => x.tarih === tarih && x.id != editingId);
            if(cakisma) {
                alert(`⚠️ Dikkat: Seçtiğiniz bu saatte (${tarih.replace('T', ' Saat: ')}) ${cakisma.musteri} adlı müşterinin randevusu zaten var!`);
                return;
            }

            if(editingId) {
                const r = randevular.find(x => x.id == editingId);
                if(r) {
                    r.musteri = musteri;
                    r.telefon = telefon;
                    r.islem = islem;
                    r.tarih = tarih;
                }
                document.getElementById('editingRandevuId').value = '';
                document.getElementById('randevuFormTitle').innerText = 'Yeni Randevu Oluştur';
                document.getElementById('randevuSaveBtn').innerText = 'Randevuyu Kaydet';
            } else {
                const yeni = { id: Date.now(), musteri, telefon, islem, tarih, durum: 'Bekliyor', bildirimGonderildi: false };
                randevular.push(yeni);
            }

            randevular.sort((a, b) => new Date(a.tarih) - new Date(b.tarih));

            localStorage.setItem('yunus_randevular', JSON.stringify(randevular));
            document.getElementById('rMusteri').value = '';
            document.getElementById('rTelefon').value = '';
            document.getElementById('rIslem').value = '';
            document.getElementById('rTarih').value = '';
            renderRandevular();
        }

        function editRandevu(id) {
            const r = randevular.find(x => x.id === id);
            if(!r) return;
            document.getElementById('editingRandevuId').value = r.id;
            document.getElementById('rMusteri').value = r.musteri;
            document.getElementById('rTelefon').value = r.telefon || '';
            document.getElementById('rIslem').value = r.islem;
            document.getElementById('rTarih').value = r.tarih;
            document.getElementById('randevuFormTitle').innerText = 'Randevu Düzenle';
            document.getElementById('randevuSaveBtn').innerText = 'Değişiklikleri Güncelle';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleRandevuDurumu(id) {
            const r = randevular.find(x => x.id === id);
            if(r) {
                r.durum = r.durum === 'Bekliyor' ? 'Tıraş Edildi' : 'Bekliyor';
                localStorage.setItem('yunus_randevular', JSON.stringify(randevular));
                renderRandevular();
            }
        }

        function deleteRandevu(id) {
            if(confirm('Bu randevuyu silmek istediğinize emin misiniz?')) {
                randevular = randevular.filter(x => x.id !== id);
                localStorage.setItem('yunus_randevular', JSON.stringify(randevular));
                renderRandevular();
            }
        }

        function sendWhatsApp(musteri, tarihStr, islem, tel) {
            if(!tel) {
                alert('Bu müşteriye ait telefon numarası girilmemiş!');
                return;
            }
            let formattedTel = tel.replace(/\D/g, '');
            if(formattedTel.startsWith('0')) {
                formattedTel = '9' + formattedTel;
            } else if(!formattedTel.startsWith('90')) {
                formattedTel = '90' + formattedTel;
            }

            const parts = tarihStr.split('T');
            const dateParts = parts[0].split('-');
            const formattedDate = `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}`;
            const formattedTime = parts[1];

            const message = `Sayın ${musteri}, Men’s Güzellik Salonu'ndan ${formattedDate} saat ${formattedTime} için (${islem}) randevunuz bulunmaktadır. Randevunuza gelemiyecek olursanız lütfen +90 (551) 398 19 92 numaralı hattan bizimle iletişime geçip iptal edebilirsiniz. Sağlıklı günler dileriz.\n\nİşletme Sahibi: Yunus Erbay`;
            
            const url = `https://wa.me/${formattedTel}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function renderRandevular() {
            const container = document.getElementById('randevuListContainer');
            const nextBanner = document.getElementById('nextCustomerBanner');
            const nextText = document.getElementById('nextCustomerText');
            container.innerHTML = '';

            randevular.sort((a, b) => new Date(a.tarih) - new Date(b.tarih));

            const bekleyenler = randevular.filter(r => r.durum === 'Bekliyor');
            if(bekleyenler.length > 0) {
                const siradaki = bekleyenler[0];
                nextText.innerHTML = `${siradaki.musteri} - (${siradaki.islem}) <br><span style="font-size:0.75rem; color:var(--text-muted);">🕒 ${siradaki.tarih.replace('T', ' Saat: ')}</span>`;
                nextBanner.classList.remove('hidden');
            } else {
                nextBanner.classList.add('hidden');
            }

            if(randevular.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; font-size:0.85rem;">Henüz kayıtlı randevu yok.</p>';
                return;
            }

            randevular.forEach(r => {
                const tarihFormatted = r.tarih.replace('T', ' Saat: ');
                const isCompleted = r.durum === 'Tıraş Edildi';
                const badgeClass = isCompleted ? 'badge-success' : 'badge-danger';

                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="item-info">
                        <h4>${r.musteri} ${r.telefon ? `<span style="font-size:0.75rem; color:var(--accent-platinum);">(${r.telefon})</span>` : ''}</h4>
                        <p>✂️ ${r.islem}</p>
                        <p>🕒 ${tarihFormatted}</p>
                        <span class="badge ${badgeClass}" style="margin-top:4px; display:inline-block;">${r.durum}</span>
                    </div>
                    <div class="item-actions">
                        ${r.telefon ? `<button class="btn-action btn-whatsapp" onclick="sendWhatsApp('${r.musteri}', '${r.tarih}', '${r.islem}', '${r.telefon}')" title="WhatsApp Mesajı Gönder"><i class="fa-brands fa-whatsapp"></i></button>` : ''}
                        <button class="btn-action btn-check" onclick="toggleRandevuDurumu(${r.id})" title="${isCompleted ? 'Bekliyora Çevir' : 'Tıraş Edildi / Onayla'}"><i class="fa-solid fa-check"></i></button>
                        <button class="btn-action btn-edit" onclick="editRandevu(${r.id})" title="Düzenle"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-action btn-delete" onclick="deleteRandevu(${r.id})" title="Sil"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- CARİ / HESAP YÖNETİMİ (TEK İSİM ÜZERİNDEN İŞLEM) ---
        function addCari() {
            const musteri = document.getElementById('cMusteri').value.trim();
            const telefon = document.getElementById('cTelefon').value.trim();
            const bakiye = parseFloat(document.getElementById('cBakiye').value);

            if(!musteri || isNaN(bakiye)) {
                alert('Lütfen geçerli müşteri adı ve tutar girin!');
                return;
            }

            const existing = cariler.find(x => x.musteri.toLowerCase() === musteri.toLowerCase());
            if(existing) {
                existing.bakiye += bakiye;
                if(telefon) existing.telefon = telefon;
            } else {
                const yeni = { id: Date.now(), musteri, telefon, bakiye, odenen: 0 };
                cariler.push(yeni);
            }

            localStorage.setItem('yunus_cariler', JSON.stringify(cariler));

            document.getElementById('cMusteri').value = '';
            document.getElementById('cTelefon').value = '';
            document.getElementById('cBakiye').value = '';
            renderCariler();
        }

        function manageCari(id) {
            const c = cariler.find(x => x.id === id);
            if(!c) return;

            const secim = prompt(`${c.musteri} adlı müşteri için yapmak istediğiniz işlemi seçin:\n\n1 - Yeni Veresiye (Borç) Ekle\n2 - Tahsilat Al (Ödeme Düş)\n\nLütfen "1" veya "2" yazın:`, "1");

            if(secim === "1") {
                const borcMiktari = prompt(`${c.musteri} için eklenecek yeni veresiye (borç) tutarını girin (TL):`, "250");
                if(borcMiktari !== null && !isNaN(parseFloat(borcMiktari))) {
                    c.bakiye += parseFloat(borcMiktari);
                    localStorage.setItem('yunus_cariler', JSON.stringify(cariler));
                    renderCariler();
                    alert('Yeni borç başarıyla hesaba eklendi.');
                }
            } else if(secim === "2") {
                const tahsilMiktari = prompt(`${c.musteri} için tahsil edilen (ödenen) tutarı girin (TL):`, c.bakiye);
                if(tahsilMiktari !== null && !isNaN(parseFloat(tahsilMiktari))) {
                    const miktar = parseFloat(tahsilMiktari);
                    c.odenen = (c.odenen || 0) + miktar;
                    c.bakiye = Math.max(0, c.bakiye - miktar);
                    localStorage.setItem('yunus_cariler', JSON.stringify(cariler));
                    renderCariler();
                    alert('Tahsilat başarıyla kasaya ve hesaba işlendi.');
                }
            }
        }

        function callCustomer(tel) {
            if(!tel) {
                alert('Telefon numarası kayıtlı değil!');
                return;
            }
            window.location.href = `tel:${tel}`;
        }

        function deleteCari(id) {
            if(confirm('Bu cari hesabı tamamen silmek istiyor musunuz?')) {
                cariler = cariler.filter(x => x.id !== id);
                localStorage.setItem('yunus_cariler', JSON.stringify(cariler));
                renderCariler();
            }
        }

        function renderCariler() {
            const container = document.getElementById('cariListContainer');
            container.innerHTML = '';

            let toplamBorc = 0;
            let toplamTahsil = 0;

            cariler.forEach(c => {
                toplamBorc += (c.bakiye || 0);
                toplamTahsil += (c.odenen || 0);
            });
            
            const toplamCiro = toplamTahsil;

            document.getElementById('statBorc').innerText = '₺' + toplamBorc.toLocaleString('tr-TR', { minimumFractionDigits: 2 });
            document.getElementById('statTahsil').innerText = '₺' + toplamTahsil.toLocaleString('tr-TR', { minimumFractionDigits: 2 });
            document.getElementById('statCiro').innerText = '₺' + toplamCiro.toLocaleString('tr-TR', { minimumFractionDigits: 2 });

            if(cariler.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; font-size:0.85rem;">Kayıtlı cari/veresiye hesap bulunmuyor.</p>';
                return;
            }

            cariler.forEach(c => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="item-info">
                        <h4>${c.musteri} ${c.telefon ? `<span style="font-size:0.75rem; color:var(--accent-platinum);">(${c.telefon})</span>` : ''}</h4>
                        <p style="color: var(--danger-color); font-weight:800; font-size:0.85rem;">Kalan Borç: ₺${c.bakiye.toLocaleString('tr-TR')}</p>
                        ${c.odenen > 0 ? `<p style="color: var(--success-color); font-size:0.75rem;">Tahsil Edilen: ₺${c.odenen.toLocaleString('tr-TR')}</p>` : ''}
                    </div>
                    <div class="item-actions">
                        ${c.telefon ? `<button class="btn-action btn-call" onclick="callCustomer('${c.telefon}')" title="Müşteriyi Ara"><i class="fa-solid fa-phone"></i></button>` : ''}
                        <button class="btn-action btn-manage" onclick="manageCari(${c.id})" title="Hesabı Düzenle (Borç Ekle / Tahsilat Al)"><i class="fa-solid fa-file-invoice"></i></button>
                        <button class="btn-action btn-delete" onclick="deleteCari(${c.id})" title="Hesabı Sil"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        renderQuickClients();
        renderRandevular();
        renderCariler();
    </script>
</body>
</html>
