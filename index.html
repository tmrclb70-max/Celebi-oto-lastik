<div class="form-group">
                <label>Stok Adedi</label>
                <input type="number" id="pStock" class="form-control" value="4">
            </div>

            <div class="form-group">
                <label>Birim Satış Fiyatı (TL)</label>
                <div class="input-with-btn">
                    <input type="number" id="pPrice" class="form-control" placeholder="Örn: 2400">
                    <button class="btn-search-img" type="button" onclick="openKarModal()"><i class="fa-solid fa-percent"></i> Kar Hesapla</button>
                </div>
            </div>

            <div class="form-group">
                <label>Görsel Bağlantısı (URL)</label>
                <div class="input-with-btn">
                    <input type="text" id="pImg" class="form-control" placeholder="İnternetten görsel bağlantısı yapıştırın">
                    <button class="btn-search-img" type="button" onclick="autoFindImage()"><i class="fa-solid fa-image"></i> Otomatik Bul</button>
                </div>
            </div>

            <button class="btn-primary" style="background: var(--success-color); color: white;" onclick="saveProduct()"><i class="fa-solid fa-check"></i> Ürünü Kaydet</button>
        </div>
    </div>

    <!-- KAR HESAPLAMA MODALI -->
    <div id="karModal" class="modal">
        <div class="modal-content" style="max-width: 420px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-calculator" style="color: var(--accent-yellow);"></i> Kar Oranı Hesaplayıcı</h3>
                <span class="close-btn" onclick="closeModal('karModal')">&times;</span>
            </div>
            <div class="form-group">
                <label>Alış / B2B Fiyatı (TL)</label>
                <input type="number" id="karAlisFiyati" class="form-control" placeholder="Örn: 2000">
            </div>
            <div class="form-group">
                <label>Kar Oranı Seçin (%)</label>
                <select id="karOraniSelect" class="form-control">
                    <option value="1">%1 Kar</option>
                    <option value="2">%2 Kar</option>
                    <option value="3">%3 Kar</option>
                    <option value="4">%4 Kar</option>
                    <option value="5">%5 Kar</option>
                    <option value="6">%6 Kar</option>
                    <option value="7">%7 Kar</option>
                    <option value="8">%8 Kar</option>
                    <option value="9">%9 Kar</option>
                    <option value="10" selected>%10 Kar</option>
                    <option value="11">%11 Kar</option>
                    <option value="12">%12 Kar</option>
                    <option value="13">%13 Kar</option>
                    <option value="14">%14 Kar</option>
                    <option value="15">%15 Kar</option>
                    <option value="16">%16 Kar</option>
                    <option value="17">%17 Kar</option>
                    <option value="18">%18 Kar</option>
                    <option value="19">%19 Kar</option>
                    <option value="20">%20 Kar</option>
                </select>
            </div>
            <button class="btn-primary" style="background: var(--success-color); color: white;" onclick="hesaplaVeAktar()"><i class="fa-solid fa-check-to-slot"></i> Hesapla ve Fiyata Aktar</button>
        </div>
    </div>

    <!-- ŞİFRE AYAR MODALI -->
    <div id="settingsModal" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-gear"></i> Sistem Ayarları</h3>
                <span class="close-btn" onclick="closeModal('settingsModal')">&times;</span>
            </div>
            <div class="form-group">
                <label>Yönetici Şifresi Değiştir</label>
                <input type="password" id="newAdminPass" class="form-control" placeholder="Yeni Yönetici Şifresi">
            </div>
            <div class="form-group">
                <label>Bayi Şifresi Değiştir</label>
                <input type="password" id="newBayiPass" class="form-control" placeholder="Yeni Bayi Şifresi">
            </div>
            <button class="btn-primary" style="background: var(--blue-color, #3b82f6); color: white;" onclick="saveSettings()"><i class="fa-solid fa-floppy-disk"></i> Ayarları Kaydet</button>
        </div>
    </div>

    <script>
        let products = [];
        let currentCategory = 'all';
        let currentUserRole = null; // 'admin' veya 'bayi'
        
        let adminPass = localStorage.getItem('celebi_admin_pass') || 'celebi166';
        let bayiPass = localStorage.getItem('celebi_bayi_pass') || 'bayi166';

        window.initFirebaseData = function() {
            if (!window.db) return;
            window.onSnapshot(window.collection(window.db, "lastik_stoklari"), (snapshot) => {
                products = [];
                snapshot.forEach((docSnap) => {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProducts();
                checkNotifications();
            });
        };

        function formatCurrency(val) {
            return '₺' + Number(val || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if ((u.toLowerCase() === 'yönetici' || u.toLowerCase() === 'yonetici' || u.toLowerCase() === 'tamer') && p === adminPass) {
                currentUserRole = 'admin';
                document.getElementById('userBadge').innerText = 'Yönetici (Tamer Çelebi)';
                initLoginSuccess();
            } else if ((u.toLowerCase() === 'bayi' || u.toLowerCase() === 'meslektas') && p === bayiPass) {
                currentUserRole = 'bayi';
                document.getElementById('userBadge').innerText = 'Bayi / Meslektaş';
                initLoginSuccess();
            } else {
                alert('Kullanıcı adı veya şifre hatalı!');
            }
        }

        function initLoginSuccess() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('portalSection').classList.remove('hidden');
            document.getElementById('userInfoArea').classList.remove('hidden');

            if (currentUserRole === 'admin') {
                document.getElementById('adminBar').classList.remove('hidden');
                document.getElementById('adminNotifBtn').classList.remove('hidden');
            } else {
                document.getElementById('adminBar').classList.add('hidden');
                document.getElementById('adminNotifBtn').classList.add('hidden');
            }
            renderProducts();
        }

        function logout() {
            currentUserRole = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('portalSection').classList.add('hidden');
            document.getElementById('userInfoArea').classList.add('hidden');
            document.getElementById('password').value = '';
        }

        function openSettingsModal() {
            document.getElementById('newAdminPass').value = '';
            document.getElementById('newBayiPass').value = '';
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function saveSettings() {
            const aPass = document.getElementById('newAdminPass').value.trim();
            const bPass = document.getElementById('newBayiPass').value.trim();

            if (aPass) {
                adminPass = aPass;
                localStorage.setItem('celebi_admin_pass', aPass);
            }
            if (bPass) {
                bayiPass = bPass;
                localStorage.setItem('celebi_bayi_pass', bPass);
            }
            alert('Şifreler başarıyla güncellendi!');
            closeModal('settingsModal');
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function checkCustomSize(select) {
            const group = document.getElementById('customSizeGroup');
            if (select.value === 'Diger') {
                group.classList.remove('hidden');
            } else {
                group.classList.add('hidden');
            }
        }

        function checkCustomBrand(select) {
            const group = document.getElementById('customBrandGroup');
            if (select.value === 'Diger') {
                group.classList.remove('hidden');
            } else {
                group.classList.add('hidden');
            }
        }

        function toggleGroupFields(val) {
            const seasonGroup = document.getElementById('seasonGroup');
            if (val === 'İç Lastik') {
                seasonGroup.classList.add('hidden');
            } else {
                seasonGroup.classList.remove('hidden');
            }
        }

        function openKarModal() {
            document.getElementById('karAlisFiyati').value = '';
            document.getElementById('karOraniSelect').value = '10';
            document.getElementById('karModal').style.display = 'flex';
        }

        function hesaplaVeAktar() {
            const alis = parseFloat(document.getElementById('karAlisFiyati').value);
            const oran = parseFloat(document.getElementById('karOraniSelect').value);

            if (!alis || alis <= 0) {
                alert('Lütfen geçerli bir alış fiyatı giriniz!');
                return;
            }

            const satisFiyati = alis * (1 + (oran / 100));
            document.getElementById('pPrice').value = Math.round(satisFiyati);
            closeModal('karModal');
        }

        function openAddModal() {
            document.getElementById('editingProductId').value = '';
            document.getElementById('modalTitleText').innerHTML = '<i class="fa-solid fa-plus-circle"></i> Yeni Ürün Ekle';
            document.getElementById('pGroupSelect').value = 'Otomobil';
            toggleGroupFields('Otomobil');
            document.getElementById('pSizeSelect').value = '205/55R16';
            document.getElementById('customSizeGroup').classList.add('hidden');
            document.getElementById('pCustomSize').value = '';
            document.getElementById('pBrandSelect').value = 'Petlas';
            document.getElementById('customBrandGroup').classList.add('hidden');
            document.getElementById('pCustomBrand').value = '';
            document.getElementById('pPattern').value = '';
            document.getElementById('pSeason').value = 'Yaz';
            document.getElementById('pDot').value = '2026';
            document.getElementById('pStock').value = '4';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImg').value = '';
            document.getElementById('productModal').style.display = 'flex';
        }

        function autoFindImage() {
            let brand = document.getElementById('pBrandSelect').value;
            if (brand === 'Diger') brand = document.getElementById('pCustomBrand').value;
            const pattern = document.getElementById('pPattern').value;
            
            // Örnek akıllı görsel atama veya placeholder
            const defaultImgs = {
                'Petlas': 'https://www.petlas.com.tr/img/urunler/l/snowmaster-w651.png',
                'Lassa': 'https://www.lassa.com.tr/assets/images/products/greenways.png',
                'Bridgestone': 'https://www.bridgestone.com.tr/assets/images/products/turanza-t005.png',
                'Michelin': 'https://www.michelin.com.tr/wcsstore/MichelinCAS/images/tyres/primacy-4.png',
                'Goodyear': 'https://www.goodyear.eu/wcsstore/GoodyearSAS/images/tyres/efficientgrip-performance-2.png'
            };

            const found = defaultImgs[brand] || 'https://images.unsplash.com/photo-1578844251758-2f71da64c96f?w=600&auto=format&fit=crop&q=80';
            document.getElementById('pImg').value = found;
            alert('Görsel bağlantısı otomatik yüklendi!');
        }

        async function saveProduct() {
            const group = document.getElementById('pGroupSelect').value;
            let size = document.getElementById('pSizeSelect').value;
            if (size === 'Diger') size = document.getElementById('pCustomSize').value.trim();

            let brand = document.getElementById('pBrandSelect').value;
            if (brand === 'Diger') brand = document.getElementById('pCustomBrand').value.trim();

            const pattern = document.getElementById('pPattern').value.trim();
            const season = (group === 'İç Lastik') ? 'Şambrel / İç Lastik' : document.getElementById('pSeason').value;
            const dot = document.getElementById('pDot').value.trim() || '2026';
            const stock = parseInt(document.getElementById('pStock').value) || 0;
            const price = parseFloat(document.getElementById('pPrice').value) || 0;
            const img = document.getElementById('pImg').value.trim() || 'https://images.unsplash.com/photo-1578844251758-2f71da64c96f?w=600&auto=format&fit=crop&q=80';

            if (!size || !brand || !price) {
                alert('Lütfen Ebat, Marka ve Fiyat alanlarını doldurunuz!');
                return;
            }

            const editingId = document.getElementById('editingProductId').value;
            const id = editingId ? editingId : 'p_' + Date.now();

            const productData = { group, size, brand, pattern, season, dot, stock, price, img };

            await window.setDoc(window.doc(window.db, "lastik_stoklari", id), productData, { merge: true });
            closeModal('productModal');
        }

        function editProduct(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;

            document.getElementById('editingProductId').value = p.id;
            document.getElementById('modalTitleText').innerHTML = '<i class="fa-solid fa-pen"></i> Ürün Düzenle';
            document.getElementById('pGroupSelect').value = p.group || 'Otomobil';
            toggleGroupFields(p.group || 'Otomobil');

            const sizeSel = document.getElementById('pSizeSelect');
            let sizeFound = false;
            for (let opt of sizeSel.options) {
                if (opt.value === p.size) { sizeSel.value = p.size; sizeFound = true; break; }
            }
            if (!sizeFound) {
                sizeSel.value = 'Diger';
                document.getElementById('customSizeGroup').classList.remove('hidden');
                document.getElementById('pCustomSize').value = p.size;
            } else {
                document.getElementById('customSizeGroup').classList.add('hidden');
            }

            const brandSel = document.getElementById('pBrandSelect');
            let brandFound = false;
            for (let opt of brandSel.options) {
                if (opt.value === p.brand) { brandSel.value = p.brand; brandFound = true; break; }
            }
            if (!brandFound) {
                brandSel.value = 'Diger';
                document.getElementById('customBrandGroup').classList.remove('hidden');
                document.getElementById('pCustomBrand').value = p.brand;
            } else {
                document.getElementById('customBrandGroup').classList.add('hidden');
            }

            document.getElementById('pPattern').value = p.pattern || '';
            document.getElementById('pSeason').value = (p.season === 'Şambrel / İç Lastik') ? 'Yaz' : (p.season || 'Yaz');
            document.getElementById('pDot').value = p.dot || '2026';
            document.getElementById('pStock').value = p.stock || 0;
            document.getElementById('pPrice').value = p.price || 0;
            document.getElementById('pImg').value = p.img || '';

            document.getElementById('productModal').style.display = 'flex';
        }

        async function updateStock(id, change) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            let newStock = (parseInt(p.stock) || 0) + change;
            if (newStock < 0) newStock = 0;

            await window.updateDoc(window.doc(window.db, "lastik_stoklari", id), { stock: newStock });
        }

        async function deleteProduct(id) {
            if (confirm("Bu ürünü silmek istediğinize emin misiniz?")) {
                await window.deleteDoc(window.doc(window.db, "lastik_stoklari", id));
            }
        }

        function openBulkPriceModal(category) {
            document.getElementById('bulkTargetCategory').value = category;
            document.getElementById('bulkModalTitle').innerHTML = `<i class="fa-solid fa-percent"></i> ${category} Grubu Toplu Zam/İndirim`;
            document.getElementById('bulkPercentInput').value = '';
            document.getElementById('bulkPriceModal').style.display = 'flex';
        }

        async function applyBulkPrice() {
            const cat = document.getElementById('bulkTargetCategory').value;
            const val = parseFloat(document.getElementById('bulkPercentInput').value);
            if (isNaN(val)) {
                alert('Lütfen geçerli bir yüzde oranı girin!');
                return;
            }

            const targetProducts = products.filter(p => {
                if (cat === 'Zirai') return p.group === 'Zirai';
                if (cat === 'İç Lastik') return p.group === 'İç Lastik';
                return p.season === cat;
            });

            if (targetProducts.length === 0) {
                alert('Bu kategoride güncellenecek ürün bulunamadı.');
                closeModal('bulkPriceModal');
                return;
            }

            for (let p of targetProducts) {
                let yeniFiyat = p.price * (1 + (val / 100));
                if (yeniFiyat < 0) yeniFiyat = 0;
                await window.updateDoc(window.doc(window.db, "lastik_stoklari", p.id), { price: Math.round(yeniFiyat) });
            }

            alert(`${targetProducts.length} adet ürüne başarıyla %${val} oranında fiyat güncellemesi uygulandı!`);
            closeModal('bulkPriceModal');
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchCat = (currentCategory === 'all') || 
                                 (currentCategory === 'Zirai' && p.group === 'Zirai') ||
                                 (currentCategory === 'İç Lastik' && p.group === 'İç Lastik') ||
                                 (p.season === currentCategory);
                
                const fullStr = `${p.size} ${p.brand} ${p.pattern} ${p.dot}`.toLowerCase();
                const matchSearch = fullStr.includes(search);

                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px; font-size: 1.1rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--card-border);">Aradığınız kriterde ürün bulunamadı.</div>`;
                return;
            }

            filtered.forEach(p => {
                const stockVal = parseInt(p.stock) || 0;
                let stockBadgeClass = 'stock-badge-in';
                let stockText = `${stockVal} Adet (Stokta)`;
                if (stockVal === 0) {
                    stockBadgeClass = 'stock-badge-out';
                    stockText = 'Tükendi (0)';
                } else if (stockVal <= 2) {
                    stockBadgeClass = 'stock-badge-low';
                    stockText = `${stockVal} Adet (Azaldı)`;
                }

                const row = document.createElement('div');
                row.className = 'product-row';

                let adminControlsHtml = '';
                let adminActionsHtml = '';

                if (currentUserRole === 'admin') {
                    adminControlsHtml = `
                        <div class="admin-stock-control">
                            <button class="btn-qty" onclick="updateStock('${p.id}', -1)">-</button>
                            <span class="admin-stock-val">${stockVal} Adet</span>
                            <button class="btn-qty" onclick="updateStock('${p.id}', 1)">+</button>
                        </div>
                    `;
                    adminActionsHtml = `
                        <div class="row-actions">
                            <button class="btn-edit-price" onclick="editProduct('${p.id}')" title="Düzenle"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-icon" onclick="deleteProduct('${p.id}')" title="Sil"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                } else {
                    adminControlsHtml = `<div class="${stockBadgeClass}">${stockText}</div>`;
                    adminActionsHtml = `
                        <div class="row-actions">
                            <button class="btn-edit-price" style="width: auto; padding: 0 14px; font-size: 0.9rem;" onclick="openDetailModal('${p.id}')"><i class="fa-solid fa-cart-shopping"></i> Sipariş Ver</button>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="mobile-card-top" onclick="openDetailModal('${p.id}')">
                        <img src="${p.img}" class="product-img" alt="Lastik">
                        <div class="mobile-card-info">
                            <span class="col-size">${p.size}</span>
                            <span class="col-brand-text">${p.brand}</span>
                        </div>
                    </div>
                    <div style="cursor: pointer;" onclick="openDetailModal('${p.id}')">
                        <span class="col-pattern">${p.pattern || 'Standart Desen'}</span>
                    </div>
                    <div style="cursor: pointer;" onclick="openDetailModal('${p.id}')">
                        <span class="tag tag-pattern"><i class="fa-solid fa-tag"></i> ${p.group || 'Otomobil'}</span>
                    </div>
                    <div style="cursor: pointer;" onclick="openDetailModal('${p.id}')">
                        <span class="tag"><i class="fa-solid fa-calendar-days"></i> ${p.season || 'Yaz'}</span>
                    </div>
                    <div style="cursor: pointer;" onclick="openDetailModal('${p.id}')">
                        <span class="tag"><i class="fa-solid fa-clock-rotate-left"></i> DOT ${p.dot || '2026'}</span>
                    </div>
                    <div style="cursor: pointer;" onclick="openDetailModal('${p.id}')">
                        ${currentUserRole === 'admin' ? `<div class="${stockBadgeClass}">${stockText}</div>` : ''}
                    </div>
                    <div class="col-price" onclick="openDetailModal('${p.id}')" style="cursor: pointer;">
                        ${formatCurrency(p.price)}
                    </div>
                    <div>${adminControlsHtml}</div>
                    <div>${adminActionsHtml}</div>
                `;
                grid.appendChild(row);
            });
        }

        function openDetailModal(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;

            document.getElementById('detImg').src = p.img;
            document.getElementById('detBrand').innerHTML = `<i class="fa-solid fa-shield-halved"></i> ${p.brand} ${p.size}`;
            document.getElementById('detSize').innerText = p.size;
            document.getElementById('detPattern').innerText = `${p.group || 'Otomobil'} / ${p.pattern || 'Standart'}`;
            document.getElementById('detSeason').innerText = p.season || 'Yaz';
            document.getElementById('detDot').innerText = p.dot || '2026';
            
            const stockVal = parseInt(p.stock) || 0;
            document.getElementById('detStock').innerText = stockVal > 0 ? `${stockVal} Adet (Stokta Var)` : 'Tükendi';
            document.getElementById('detPrice').innerText = formatCurrency(p.price);

            const bayiArea = document.getElementById('bayiOrderArea');
            if (currentUserRole === 'bayi') {
                bayiArea.classList.remove('hidden');
            } else {
                bayiArea.classList.add('hidden');
            }

            document.getElementById('detailModal').style.display = 'flex';
        }

        function requestBayiOrder() {
            const qty = document.getElementById('bayiReqQty').value;
            alert(`Sipariş talebiniz Tamer Çelebi'ye iletildi! (${qty} Adet talep edildi). En kısa sürede sizinle iletişime geçilecektir.`);
            closeModal('detailModal');
        }

        function checkNotifications() {
            const lowOrZero = products.filter(p => (parseInt(p.stock) || 0) <= 1);
            const badge = document.getElementById('notifBadge');
            if (lowOrZero.length > 0) {
                badge.innerText = lowOrZero.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openNotifModal() {
            const container = document.getElementById('notifListContainer');
            container.innerHTML = '';

            const lowOrZero = products.filter(p => (parseInt(p.stock) || 0) <= 1);

            if (lowOrZero.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Kritik stokta ürün bulunmuyor. Her şey yolunda! 👍</div>`;
            } else {
                lowOrZero.forEach(p => {
                    const stockVal = parseInt(p.stock) || 0;
                    const badgeClass = stockVal === 0 ? 'notif-stock-zero' : 'notif-stock-odd';
                    const text = stockVal === 0 ? 'TÜKENDİ (0)' : 'SON 1 ADET';

                    const item = document.createElement('div');
                    item.className = 'notif-item';
                    item.innerHTML = `
                        <div>
                            <div class="notif-item-title">${p.brand} - ${p.size} (${p.pattern || 'Standart'})</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${p.group || 'Otomobil'} | DOT: ${p.dot || '2026'}</div>
                        </div>
                        <span class="notif-item-stock ${badgeClass}">${text}</span>
                    `;
                    container.appendChild(item);
                });
            }

            document.getElementById('notifModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>
</body>
</html>
