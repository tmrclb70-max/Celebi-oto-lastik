<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çelebi Oto Lastik - B2B Stok Portalı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-yellow: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

        /* HEADER & ŞEFFAF ARKA PLANLI LOGO */
        header { background: #020617; border-bottom: 3px solid #dc2626; padding: 12px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        
        .logo-wrapper { display: flex; align-items: center; gap: 18px; }
        
        /* LOGO KUTUSU (ŞEFFAF / ARKA PLANSIZ) */
        .brand-logo-box { background: transparent; padding: 2px; display: flex; align-items: center; }
        .site-logo-img { height: 60px; max-width: 220px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); mix-blend-mode: screen; }

        .slogan-area h1 { font-size: 1.3rem; font-weight: 800; color: #ffffff; }
        .slogan-area p { font-size: 0.85rem; color: var(--accent-yellow); font-style: italic; font-weight: 600; margin-top: 2px; }

        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 8px; border: 1px solid var(--card-border); }
        .user-badge { color: var(--accent-yellow); font-weight: 600; }
        .btn-logout { background: var(--danger-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        /* MAIN CONTAINER */
        .main-container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }

        /* GİRİŞ EKRANI */
        .login-card { max-width: 400px; margin: 40px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 2px solid var(--accent-yellow); box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        .login-card h2 { margin-bottom: 18px; color: var(--accent-yellow); font-size: 1.4rem; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: var(--text-main); font-weight: 600; }
        .form-control { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--card-border); background: #0f172a; color: white; font-size: 0.95rem; }
        
        .btn-primary { width: 100%; padding: 12px; background: var(--accent-yellow); color: #000; font-weight: 800; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: 0.2s; margin-top: 10px; }
        .btn-primary:hover { background: var(--accent-hover); }

        /* ARAMA VE KONTROLLER */
        .controls-section { background: var(--card-bg); padding: 18px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 20px; }
        .search-box { position: relative; margin-bottom: 12px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.1rem; }
        .search-box input { width: 100%; padding: 12px 12px 12px 42px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: white; font-size: 1rem; }
        
        .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { flex: 1; min-width: 100px; padding: 8px; background: #0f172a; border: 1px solid var(--card-border); color: var(--text-main); border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.9rem; }
        .filter-btn.active { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

        /* YÖNETİCİ ÇUBUĞU */
        .admin-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; background: rgba(255,255,255,0.03); padding: 12px 18px; border-radius: 8px; border: 1px solid var(--card-border); }
        .btn-add { background: var(--success-color); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; }

        /* ÜRÜN IZGARASI */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
        
        .product-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; display: flex; gap: 12px; align-items: center; position: relative; cursor: pointer; transition: 0.2s; }
        .product-card:hover { border-color: var(--accent-yellow); transform: translateY(-2px); }
        .product-img { width: 85px; height: 85px; object-fit: contain; background: #ffffff; padding: 5px; border-radius: 8px; border: 1px solid var(--card-border); }
        .product-details { flex: 1; }
        .product-brand { font-size: 0.85rem; color: var(--accent-yellow); font-weight: 700; text-transform: uppercase; }
        .product-size { font-size: 1.2rem; font-weight: 800; color: #fff; margin: 2px 0; }
        .product-tags { display: flex; gap: 5px; margin-top: 5px; }
        .tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: #0f172a; color: var(--text-muted); border: 1px solid var(--card-border); }
        .product-price-area { text-align: right; }
        .product-price { font-size: 1.25rem; font-weight: 800; color: var(--success-color); }
        .product-stock { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }

        .card-actions { position: absolute; top: 8px; right: 8px; z-index: 5; }
        .btn-icon { background: rgba(0,0,0,0.5); color: #fff; border: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: var(--danger-color); }

        /* MODALLAR */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: flex-start; z-index: 1000; padding: 20px; overflow-y: auto; }
        .modal-content { background: var(--card-bg); border-radius: 12px; padding: 20px; width: 100%; max-width: 480px; border: 1px solid var(--card-border); margin: 20px auto; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        /* DETAY MODALI ÖZEL */
        .detail-modal-content { max-width: 650px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; background: #1e293b; border: 2px solid var(--accent-yellow); }
        .detail-left { flex: 1; min-width: 220px; text-align: center; background: #ffffff; padding: 15px; border-radius: 10px; }
        .detail-left img { width: 100%; height: 200px; object-fit: contain; }
        .detail-right { flex: 1.5; min-width: 250px; }
        .detail-right h2 { color: var(--accent-yellow); font-size: 1.5rem; margin-bottom: 10px; }
        .detail-info-row { font-size: 1rem; margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
        .detail-info-row span:first-child { color: var(--text-muted); }
        .detail-info-row span:last-child { font-weight: bold; color: #fff; }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; width: 100%; }
        .modal-header h3 { color: var(--accent-yellow); font-size: 1.2rem; }
        .close-btn { font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }

        .hidden { display: none !important; }
    </style>
</head>

            <div class="logo-wrapper">
                <!-- ARKA PLANSIZ ORİJİNAL LOGO -->
                <div class="brand-logo-box">
                    <img src="https://i.ibb.co/3ykG8L3/celebi-logo.png" class="site-logo-img" alt="Çelebi Oto Lastik Logo" onerror="this.onerror=null; this.parentElement.innerHTML='<span style=\'color:#dc2626; font-weight:bold; font-size:1.5rem; font-style:italic;\'>ÇELEBİ OTO LASTİK</span>';">
                </div>
                <div class="slogan-area">
                    <h1>ÇELEBİ OTO LASTİK B2B</h1>
                    <p>"Yolunuzda Güven, Lastiğinizde Kalite"</p>
                </div>
            </div>
            <div id="userInfoArea" class="user-info hidden">
                <span>Giriş Yapan: <strong id="userBadge" class="user-badge">--</strong></span>

            </div>
        </div>
    </header>

    <div class="main-container">
