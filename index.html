<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çelebi Oto Lastik - B2B Stok Portalı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-yellow: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

        /* HEADER & LOGO AREA */
        header { background: #020617; border-bottom: 3px solid #dc2626; padding: 12px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        
        .logo-wrapper { display: flex; align-items: center; gap: 18px; }
        .logo-box { background: #ffffff; padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(220, 38, 38, 0.4); border: 2px solid #dc2626; }
        .site-logo { height: 55px; max-width: 180px; object-fit: contain; }
        
        .slogan-area h1 { font-size: 1.5rem; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; }
        .slogan-area p { font-size: 0.9rem; color: var(--accent-yellow); font-style: italic; font-weight: 600; margin-top: 2px; }

        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 8px; border: 1px solid var(--card-border); }
        .user-badge { color: var(--accent-yellow); font-weight: 600; }
        .btn-logout { background: var(--danger-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-logout:hover { opacity: 0.9; }

        /* MAIN CONTAINER */
        .main-container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }

        /* LOGIN SCREEN - TAM DÜZELTİLMİŞ & BUTON GARANTİLİ */
        .login-card { max-width: 420px; margin: 30px auto; background: var(--card-bg); padding: 30px; border-radius: 14px; border: 2px solid var(--accent-yellow); box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; }
        .login-card h2 { margin-bottom: 22px; color: var(--accent-yellow); font-size: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.95rem; color: var(--text-main); font-weight: 600; }
        .form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); background: #0f172a; color: white; font-size: 1rem; }
        .form-control:focus { outline: none; border-color: var(--accent-yellow); }
        
        .btn-primary { width: 100%; padding: 14px; background: var(--accent-yellow); color: #000; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

        /* SEARCH & CONTROLS */
        .controls-section { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 25px; }
        .search-box { position: relative; margin-bottom: 15px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem; }
        .search-box input { width: 100%; padding: 14px 14px 14px 45px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: white; font-size: 1.1rem; }
        
        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { flex: 1; min-width: 120px; padding: 10px; background: #0f172a; border: 1px solid var(--card-border); color: var(--text-main); border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .filter-btn.active { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

        /* ADMIN PANEL ACTIONS */
        .admin-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-add { background: var(--success-color); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }

        /* PRODUCT GRID */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        .product-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 18px; display: flex; gap: 15px; align-items: center; position: relative; transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.3); border-color: var(--accent-yellow); }
        .product-img { width: 90px; height: 90px; object-fit: contain; background: #ffffff; padding: 6px; border-radius: 8px; border: 1px solid var(--card-border); }
        .product-details { flex: 1; }
        .product-brand { font-size: 0.85rem; color: var(--accent-yellow); font-weight: 700; text-transform: uppercase; }
        .product-size { font-size: 1.25rem; font-weight: 800; color: #fff; margin: 2px 0; }
        .product-tags { display: flex; gap: 6px; margin-top: 6px; }
        .tag { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; background: #0f172a; color: var(--text-muted); border: 1px solid var(--card-border); }
        .product-price-area { text-align: right; }
        .product-price { font-size: 1.3rem; font-weight: 800; color: var(--success-color); }
        .product-stock { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }

        .card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; }
        .btn-icon { background: rgba(0,0,0,0.5); color: #fff; border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: var(--danger-color); }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card-bg); border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; border: 1px solid var(--card-border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { color: var(--accent-yellow); }
        .close-btn { font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo-wrapper">
                <div class="logo-box">
                    <img src="https://i.ibb.co/3ykG8L3/celebi-logo.png" class="site-logo" alt="Çelebi Oto Lastik Logo" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\"fa-solid fa-compact-disc\" style=\"font-size:2.2rem; color:#dc2626;\"></i>';">
                </div>
                <div class="slogan-area">
                    <h1>ÇELEBİ OTO LASTİK B2B</h1>
                    <p>"Yolunuzda Güven, Lastiğinizde Kalite"</p>
                </div>
            </div>
            <div id="userInfoArea" class="user-info hidden">
                <span>Giriş Yapan: <strong id="userBadge" class="user-badge">--</strong></span>
                <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="main-container">

        <!-- GİRİŞ EKRANI -->
        <div id="loginSection" class="login-card">
            <h2><i class="fa-solid fa-lock"></i> B2B Portal Girişi</h2>
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" class="form-control" placeholder="Örn: admin veya bayi">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" class="form-control" placeholder="****">
            </div>
            <button class="btn-primary" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
        </div>

        <!-- PORTAL İÇERİĞİ -->
        <div id="portalSection" class="hidden">
            
            <!-- ARAMA VE FİLTRELEME -->
            <div class="controls-section">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Ebat veya Marka Ara... (Örn: 205/55 veya Petlas)">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="setSeason('all', this)"><i class="fa-solid fa-border-all"></i> Tüm Ürünler</button>
                    <button class="filter-btn" onclick="setSeason('Yaz', this)"><i class="fa-solid fa-sun"></i> Yaz Lastikleri</button>
                    <button class="filter-btn" onclick="setSeason('Kış', this)"><i class="fa-solid fa-snowflake"></i> Kış Lastikleri</button>
                    <button class="filter-btn" onclick="setSeason('4 Mevsim', this)"><i class="fa-solid fa-cloud-sun-rain"></i> 4 Mevsim</button>
                </div>
            </div>

            <!-- YÖNETİCİ ÇUBUĞU -->
            <div id="adminBar" class="admin-bar hidden">
                <h3 style="color: var(--text-muted);"><i class="fa-solid fa-boxes-stacked"></i> Stok Listesi</h3>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-add" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Yeni Ürün Ekle</button>
                    <button class="btn-add" style="background: #3b82f6;" onclick="openSettingsModal()"><i class="fa-solid fa-gear"></i> Ayarlar / Şifreler</button>
                </div>
            </div>

            <!-- ÜRÜN IZGARASI -->
            <div id="productsGrid" class="products-grid">
                <!-- Ürünler JavaScript ile buraya doldurulacak -->
            </div>

        </div>

    </div>

    <!-- ÜRÜN EKLEME MODALI -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-plus-circle"></i> Yeni Ürün Ekle</h3>
                <span class="close-btn" onclick="closeModal('productModal')">&times;</span>
            </div>
            <div class="form-group">
                <label>Marka & Model</label>
                <input type="text" id="pBrand" class="form-control" placeholder="Örn: Petlas Snowmaster 2">
            </div>
            <div class="form-group">
                <label>Ebat</label>
                <input type="text" id="pSize" class="form-control" placeholder="Örn: 205/55R16">
            </div>
            <div class="form-group">
                <label>Mevsim</label>
                <select id="pSeason" class="form-control">
                    <option value="Yaz">Yaz</option>
                    <option value="Kış">Kış</option>
                    <option value="4 Mevsim">4 Mevsim</option>
                </select>
            </div>
            <div class="form-group">
                <label>DOT (Üretim Yılı)</label>
                <input type="text" id="pDot" class="form-control" placeholder="Örn: 2026">
            </div>
            <div class="form-group">
                <label>Görsel URL (İsteğe Bağlı)</label>
                <input type="text" id="pImg" class="form-control" placeholder="Resim linki yapıştırın veya boş bırakın">
            </div>
            <div class="form-group">
                <label>Fiyat (TL)</label>
                <input type="number" id="pPrice" class="form-control" placeholder="Örn: 3900">
            </div>
            <div class="form-group">
                <label>Stok Adedi</label>
                <input type="number" id="pStock" class="form-control" placeholder="Örn: 12">
            </div>
            <button class="btn-primary" onclick="saveProduct()">Ürünü Kaydet</button>
        </div>
    </div>

    <!-- AYARLAR & ŞİFRE MODALI -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-gear"></i> Yönetici Ayarları</h3>
                <span class="close-btn" onclick="closeModal('settingsModal')">&times;</span>
            </div>
            <div class="form-group">
                <label>Admin Şifresi</label>
                <input type="text" id="cfgAdminPass" class="form-control">
            </div>
            <div class="form-group">
                <label>Bayi Kullanıcı Adı</label>
                <input type="text" id="cfgBayiUser" class="form-control">
            </div>
            <div class="form-group">
                <label>Bayi Şifresi</label>
                <input type="text" id="cfgBayiPass" class="form-control">
            </div>
            <button class="btn-primary" onclick="saveSettings()">Ayarları Kaydet</button>
        </div>
    </div>

    <script>
        const DEFAULT_TIRE_IMG = "https://images.unsplash.com/photo-1578844251758-2f71da64c96f?w=300&auto=format&fit=crop&q=80";

        let config = JSON.parse(localStorage.getItem('celebi_config')) || {
            adminUser: 'admin',
            adminPass: '1234',
            bayiUser: 'bayi',
            bayiPass: '1234'
        };

        let products = JSON.parse(localStorage.getItem('celebi_products')) || [
            { id: 1, brand: 'Petlas Snowmaster 2', size: '205/55R16', season: 'Kış', dot: '2026', price: 3900, stock: 12, img: DEFAULT_TIRE_IMG }
        ];

        let currentUser = null;
        let selectedSeason = 'all';

        function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if (u === config.adminUser && p === config.adminPass) {
                currentUser = { role: 'admin', name: 'Yönetici' };
            } else if (u === config.bayiUser && p === config.bayiPass) {
                currentUser = { role: 'bayi', name: config.bayiUser };
            } else {
                alert('Kullanıcı adı veya şifre hatalı!');
                return;
            }

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('portalSection').classList.remove('hidden');
            document.getElementById('userInfoArea').classList.remove('hidden');
            document.getElementById('userBadge').innerText = currentUser.name;

            if (currentUser.role === 'admin') {
                document.getElementById('adminBar').classList.remove('hidden');
            } else {
                document.getElementById('adminBar').classList.add('hidden');
            }

            renderProducts();
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('portalSection').classList.add('hidden');
            document.getElementById('userInfoArea').classList.add('hidden');
        }

        function setSeason(season, btn) {
            selectedSeason = season;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchSearch = p.brand.toLowerCase().includes(search) || p.size.toLowerCase().includes(search);
                const matchSeason = selectedSeason === 'all' || p.season === selectedSeason;
                return matchSearch && matchSeason;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Aranan kriterlere uygun ürün bulunamadı.</p>';
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const imgSrc = p.img && p.img.trim() !== '' ? p.img : DEFAULT_TIRE_IMG;
                
                card.innerHTML = `
                    ${currentUser.role === 'admin' ? `<div class="card-actions"><button class="btn-icon" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button></div>` : ''}
                    <img src="${imgSrc}" class="product-img" alt="Lastik" onerror="this.src='${DEFAULT_TIRE_IMG}'">
                    <div class="product-details">
                        <div class="product-brand">${p.brand}</div>
                        <div class="product-size">${p.size}</div>
                        <div class="product-tags">
                            <span class="tag">${p.season}</span>
                            <span class="tag">DOT ${p.dot}</span>
                        </div>
                    </div>
                    <div class="product-price-area">
                        <div class="product-price">${Number(p.price).toLocaleString('tr-TR')} TL</div>
                        <div class="product-stock"><i class="fa-solid fa-boxes-stacked"></i> ${p.stock} Adet</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openAddModal() { document.getElementById('productModal').style.display = 'flex'; }
        function openSettingsModal() { 
            document.getElementById('cfgAdminPass').value = config.adminPass;
            document.getElementById('cfgBayiUser').value = config.bayiUser;
            document.getElementById('cfgBayiPass').value = config.bayiPass;
            document.getElementById('settingsModal').style.display = 'flex'; 
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function saveProduct() {
            const brand = document.getElementById('pBrand').value;
            const size = document.getElementById('pSize').value;
            const season = document.getElementById('pSeason').value;
            const dot = document.getElementById('pDot').value;
            const img = document.getElementById('pImg').value;
            const price = document.getElementById('pPrice').value;
            const stock = document.getElementById('pStock').value;

            if(!brand || !size || !price || !stock) { alert('Lütfen zorunlu alanları doldurun!'); return; }

            products.push({ id: Date.now(), brand, size, season, dot, img, price: Number(price), stock: Number(stock) });
            localStorage.setItem('celebi_products', JSON.stringify(products));
            closeModal('productModal');
            renderProducts();
        }

        function deleteProduct(id) {
            if(confirm('Bu ürünü silmek istediğinize emin misiniz?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('celebi_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function saveSettings() {
            config.adminPass = document.getElementById('cfgAdminPass').value;
            config.bayiUser = document.getElementById('cfgBayiUser').value;
            config.bayiPass = document.getElementById('cfgBayiPass').value;
            localStorage.setItem('celebi_config', JSON.stringify(config));
            alert('Ayarlar kaydedildi!');
            closeModal('settingsModal');
        }
    </script>
</body>
</html>
