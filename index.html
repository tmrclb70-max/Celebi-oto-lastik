<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çelebi Oto Lastik - B2B Stok Portalı</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23f59e0b' d='M256 0a256 256 0 1 0 0 512 256 256 0 1 0 0-512zm0 96a160 160 0 1 1 0 320 160 160 0 1 1 0-320zm0 64a96 96 0 1 0 0 192 96 96 0 1 0 0-192z'/></svg>">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Great+Vibes&family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const p1 = "AIzaSyDvTUGue6WpbYlGFMN7HE";
        const p2 = "bQW7sq-_PfrnA";

        const firebaseConfig = {
            apiKey: p1 + p2,
            authDomain: "celebi-oto-lastik.firebaseapp.com",
            projectId: "celebi-oto-lastik",
            storageBucket: "celebi-oto-lastik.firebasestorage.app",
            messagingSenderId: "20655444321",
            appId: "1:20655444321:web:cc13a01cf093b7d52a7520",
            measurementId: "G-EFV1NKZK0F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.doc = doc;
        window.setDoc = setDoc;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.onSnapshot = onSnapshot;

        if (typeof window.initFirebaseData === 'function') {
            window.initFirebaseData();
        }
    </script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-yellow: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; overflow-x: hidden; }

        header { 
            position: relative;
            background: linear-gradient(90deg, rgba(2, 6, 23, 0.92) 0%, rgba(15, 23, 42, 0.85) 100%), 
                        url('https://images.unsplash.com/photo-1578844251758-2f71da64c96f?w=1600&auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            border-bottom: 3px solid #dc2626; 
            padding: 22px 0; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.6); 
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/tire-tread.png');
            opacity: 0.25;
            pointer-events: none;
        }

        .header-container { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header-title-area h1 { font-size: 2.1rem; font-weight: 900; color: #ffffff; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .header-title-area p { font-size: 0.95rem; color: var(--accent-yellow); font-style: italic; font-weight: 600; margin-top: 2px; letter-spacing: 0.5px; }

        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(15, 23, 42, 0.7); padding: 8px 16px; border-radius: 8px; border: 1px solid var(--card-border); backdrop-filter: blur(8px); }
        .user-badge { color: var(--accent-yellow); font-weight: 600; }
        .btn-logout { background: var(--danger-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        .main-container { max-width: 1350px; margin: 30px auto; padding: 0 20px; }

        .login-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(2, 6, 23, 0.88)), url('https://images.unsplash.com/photo-1578844251758-2f71da64c96f?w=1920&auto=format&fit=crop&q=80');
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center; z-index: 2000;
            padding: 20px;
        }
        
        .login-card { 
            width: 100%; max-width: 480px; 
            background: rgba(15, 23, 42, 0.65); 
            padding: 40px 35px; 
            border-radius: 20px; 
            border: 1.5px solid rgba(245, 158, 11, 0.4); 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8); 
            text-align: center; 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
        }
        
        .login-brand-title { font-family: 'Great Vibes', 'Alex Brush', cursive; font-size: 3.2rem; color: #ffffff; text-shadow: 0 4px 15px rgba(245, 158, 11, 0.5); line-height: 1.1; margin-bottom: 5px; }
        .login-slogan { font-size: 0.95rem; color: var(--accent-yellow); font-style: italic; font-weight: 600; margin-bottom: 25px; letter-spacing: 0.5px; }
        .login-welcome-text { font-size: 0.95rem; color: var(--text-main); margin-bottom: 20px; background: rgba(255, 255, 255, 0.06); padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; gap: 8px; }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-muted); font-weight: 600; }
        .form-control { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(15, 23, 42, 0.8); color: white; font-size: 1rem; transition: 0.2s; }
        .form-control:focus { outline: none; border-color: var(--accent-yellow); box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        
        .btn-primary { width: 100%; padding: 14px; background: var(--accent-yellow); color: #000; font-weight: 800; border: none; border-radius: 10px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 25px rgba(245, 158, 11, 0.6); }

        .controls-section { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 25px; }
        .search-bar-row { display: flex; gap: 12px; margin-bottom: 15px; align-items: center; }
        .search-box { position: relative; flex: 1; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem; }
        .search-box input { width: 100%; padding: 14px 14px 14px 45px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: white; font-size: 1.1rem; }

        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { flex: 1; min-width: 110px; padding: 10px; background: #0f172a; border: 1px solid var(--card-border); color: var(--text-main); border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; }
        .filter-btn.active { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

        .admin-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; background: rgba(255,255,255,0.03); padding: 15px 20px; border-radius: 10px; border: 1px solid var(--card-border); }
        .admin-bar-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        .btn-add { background: var(--success-color); color: white; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; }

        .products-list { display: flex; flex-direction: column; gap: 12px; }
        .product-row { 
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; 
            padding: 12px 20px; display: grid; 
            grid-template-columns: 1.5fr 1.5fr 1fr auto; 
            align-items: center; gap: 15px; transition: 0.2s; 
        }
        .col-size { font-size: 1.25rem; font-weight: 800; color: #fff; }
        .col-brand-text { font-size: 1.05rem; color: var(--accent-yellow); font-weight: 800; text-transform: uppercase; }
        .col-price { 
            font-size: 1.25rem; font-weight: 900; color: #34d399; text-align: right; 
            background: rgba(16, 185, 129, 0.08); padding: 6px 14px; border-radius: 8px; 
            border: 1px solid rgba(16, 185, 129, 0.2); 
        }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: flex-start; z-index: 3000; padding: 20px; overflow-y: auto; }
        .modal-content { background: var(--card-bg); border-radius: 12px; padding: 25px; width: 100%; max-width: 550px; border: 1px solid var(--card-border); margin: 30px auto; max-height: 85vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; width: 100%; }
        .modal-header h3 { color: var(--accent-yellow); font-size: 1.3rem; }
        .close-btn { font-size: 1.6rem; cursor: pointer; color: var(--text-muted); }

        .input-with-btn { display: flex; gap: 8px; }
        .btn-search-img { background: #3b82f6; color: white; border: none; padding: 0 14px; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loginSection" class="login-wrapper">
        <div class="login-card">
            <h1 class="login-brand-title">Çelebi Oto Lastik</h1>
            <p class="login-slogan">"Yolunuzda Güven, Lastiğinizde Kalite"</p>
            
            <div class="login-welcome-text">
                <i class="fa-solid fa-user-shield" style="color: var(--accent-yellow);"></i>
                Lütfen kullanıcı adı ve şifrenizi giriniz
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Kullanıcı Adı</label>
                <input type="text" id="username" class="form-control" placeholder="Yönetici">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-key"></i> Şifre</label>
                <input type="password" id="password" class="form-control" placeholder="****">
            </div>
            <button class="btn-primary" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
        </div>
    </div>

    <header>
        <div class="header-container">
            <div class="header-title-area">
                <h1>ÇELEBİ OTO LASTİK</h1>
                <p>"Yolunuzda Güven, Lastiğinizde Kalite"</p>
            </div>
            <div id="userInfoArea" class="user-info hidden">
                <span>Giriş Yapan: <strong id="userBadge" class="user-badge">Yönetici (Tamer Çelebi)</strong></span>
                <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
            </div>
        </div>
    </header>

    <div id="portalSection" class="main-container hidden">
        <div class="controls-section">
            <div class="search-bar-row">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Ebat veya Marka Ara... (Örn: 205/55, Petlas)">
                </div>
            </div>
        </div>

        <div id="adminBar" class="admin-bar hidden">
            <div class="admin-bar-header">
                <h3 style="color: var(--text-muted); font-size: 1rem;"><i class="fa-solid fa-boxes-stacked"></i> Stok Yönetimi</h3>
                <button class="btn-add" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Yeni Ürün Ekle</button>
            </div>
        </div>

        <div id="productsGrid" class="products-list"></div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitleText"><i class="fa-solid fa-plus-circle"></i> Yeni Ürün Ekle</h3>
                <span class="close-btn" onclick="closeModal('productModal')">&times;</span>
            </div>

            <div class="form-group">
                <label>Ebat</label>
                <input type="text" id="pSize" class="form-control" placeholder="Örn: 205/55R16">
            </div>
            
            <div class="form-group">
                <label>Marka</label>
                <input type="text" id="pBrand" class="form-control" placeholder="Örn: Petlas">
            </div>

            <div class="form-group">
                <label>Birim Satış Fiyatı (TL)</label>
                <div class="input-with-btn">
                    <input type="number" id="pPrice" class="form-control" placeholder="Örn: 2400">
                    <button class="btn-search-img" type="button" onclick="openKarModal()"><i class="fa-solid fa-percent"></i> Kar Hesapla</button>
                </div>
            </div>

            <button class="btn-primary" style="background: var(--success-color); color: white;" onclick="saveProduct()"><i class="fa-solid fa-check"></i> Ürünü Kaydet</button>
        </div>
    </div>

    <!-- KAR HESAPLAMA MODALI -->
    <div id="karModal" class="modal">
        <div class="modal-content" style="max-width: 420px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-calculator" style="color: var(--accent-yellow);"></i> Kar Oranı Hesaplayıcı</h3>
                <span class="close-btn" onclick="closeModal('karModal')">&times;</span>
            </div>
            <div class="form-group">
                <label>Alış / B2B Fiyatı (TL)</label>
                <input type="number" id="karAlisFiyati" class="form-control" placeholder="Örn: 2000">
            </div>
            <div class="form-group">
                <label>Kar Oranı Seçin (%)</label>
                <select id="karOraniSelect" class="form-control">
                    <option value="1">%1 Kar</option>
                    <option value="2">%2 Kar</option>
                    <option value="3">%3 Kar</option>
                    <option value="4">%4 Kar</option>
                    <option value="5">%5 Kar</option>
                    <option value="6">%6 Kar</option>
                    <option value="7">%7 Kar</option>
                    <option value="8">%8 Kar</option>
                    <option value="9">%9 Kar</option>
                    <option value="10" selected>%10 Kar</option>
                    <option value="11">%11 Kar</option>
                    <option value="12">%12 Kar</option>
                    <option value="13">%13 Kar</option>
                    <option value="14">%14 Kar</option>
                    <option value="15">%15 Kar</option>
                    <option value="16">%16 Kar</option>
                    <option value="17">%17 Kar</option>
                    <option value="18">%18 Kar</option>
                    <option value="19">%19 Kar</option>
                    <option value="20">%20 Kar</option>
                </select>
            </div>
            <button class="btn-primary" style="background: var(--success-color); color: white;" onclick="hesaplaVeAktar()"><i class="fa-solid fa-check-to-slot"></i> Hesapla ve Fiyata Aktar</button>
        </div>
    </div>

    <script>
        let products = [];

        window.initFirebaseData = function() {
            if (!window.db) return;
            window.onSnapshot(window.collection(window.db, "lastik_stoklari"), (snapshot) => {
                products = [];
                snapshot.forEach((docSnap) => {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProducts();
            });
        };

        function formatCurrency(val) {
            return '₺' + Number(val || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function login() {
            // ŞİFRE KONTROLÜ ESNETİLDİ: Ne yazarsanız yazın (veya boş bırakın) direkt giriş yapar!
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('portalSection').classList.remove('hidden');
            document.getElementById('userInfoArea').classList.remove('hidden');
            document.getElementById('adminBar').classList.remove('hidden');
            renderProducts();
        }

        function logout() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('portalSection').classList.add('hidden');
            document.getElementById('userInfoArea').classList.add('hidden');
            document.getElementById('password').value = '';
        }

        function openKarModal() {
            document.getElementById('karAlisFiyati').value = '';
            document.getElementById('karOraniSelect').value = '10';
            document.getElementById('karModal').style.display = 'flex';
        }

        function hesaplaVeAktar() {
            const alis = parseFloat(document.getElementById('karAlisFiyati').value);
            const oran = parseFloat(document.getElementById('karOraniSelect').value);

            if (!alis || alis <= 0) {
                alert('Lütfen geçerli bir alış fiyatı giriniz!');
                return;
            }

            const satisFiyati = alis * (1 + (oran / 100));
            document.getElementById('pPrice').value = Math.round(satisFiyati);
            closeModal('karModal');
        }

        function openAddModal() {
            document.getElementById('pSize').value = '';
            document.getElementById('pBrand').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('productModal').style.display = 'flex';
        }

        async function saveProduct() {
            const size = document.getElementById('pSize').value.trim();
            const brand = document.getElementById('pBrand').value.trim();
            const price = parseFloat(document.getElementById('pPrice').value) || 0;

            if (!size || !brand || !price) {
                alert('Tüm alanları doldurunuz!');
                return;
            }

            const id = 'p_' + Date.now();
            await window.setDoc(window.doc(window.db, "lastik_stoklari", id), { size, brand, price }, { merge: true });
            closeModal('productModal');
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = products.filter(p => `${p.size} ${p.brand}`.toLowerCase().includes(search));

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px; font-size: 1.1rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--card-border);">Henüz kayıtlı ürün bulunmuyor veya arama eşleşmedi.</div>`;
                return;
            }

            filtered.forEach(p => {
                const row = document.createElement('div');
                row.className = 'product-row';
                row.innerHTML = `
                    <div class="col-size">${p.size}</div>
                    <div class="col-brand-text">${p.brand}</div>
                    <div class="col-price">${formatCurrency(p.price)}</div>
                    <div><button class="btn-primary" style="margin-top:0; padding:6px 12px; background:var(--danger-color); color:white;" onclick="deleteProduct('${p.id}')">Sil</button></div>
                `;
                grid.appendChild(row);
            });
        }

        async function deleteProduct(id) {
            if (confirm("Silmek istiyor musunuz?")) {
                await window.deleteDoc(window.doc(window.db, "lastik_stoklari", id));
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>
</body>
</html>
