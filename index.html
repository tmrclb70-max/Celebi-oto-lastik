<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çelebi Oto Lastik - B2B Stok Portalı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-yellow: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

        /* HEADER */
        header { background: #020617; border-bottom: 3px solid #dc2626; padding: 16px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        
        .header-title-area h1 { font-size: 1.8rem; font-weight: 900; color: #ffffff; letter-spacing: 1px; text-transform: uppercase; }
        .header-title-area p { font-size: 0.9rem; color: var(--accent-yellow); font-style: italic; font-weight: 600; margin-top: 2px; }

        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 8px; border: 1px solid var(--card-border); }
        .user-badge { color: var(--accent-yellow); font-weight: 600; }
        .btn-logout { background: var(--danger-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        /* MAIN CONTAINER */
        .main-container { max-width: 1350px; margin: 30px auto; padding: 0 20px; }

        /* GİRİŞ EKRANI */
        .login-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.92)), url('https://images.unsplash.com/photo-1543465116-ba38d720aec1?w=1600&auto=format&fit=crop&q=80');
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .login-card { width: 100%; max-width: 440px; background: rgba(30, 41, 59, 0.95); padding: 35px; border-radius: 16px; border: 2px solid var(--accent-yellow); box-shadow: 0 15px 35px rgba(0,0,0,0.7); text-align: center; backdrop-filter: blur(10px); }
        .login-card h2 { margin-bottom: 25px; color: var(--accent-yellow); font-size: 1.6rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-main); font-weight: 600; }
        .form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); background: #0f172a; color: white; font-size: 1rem; }
        .form-control:focus { outline: none; border-color: var(--accent-yellow); }
        
        .btn-primary { width: 100%; padding: 14px; background: var(--accent-yellow); color: #000; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

        /* ARAMA VE KONTROLLER */
        .controls-section { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 25px; }
        .search-box { position: relative; margin-bottom: 15px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem; }
        .search-box input { width: 100%; padding: 14px 14px 14px 45px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: white; font-size: 1.1rem; }
        
        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { flex: 1; min-width: 120px; padding: 10px; background: #0f172a; border: 1px solid var(--card-border); color: var(--text-main); border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; }
        .filter-btn.active { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

        /* YÖNETİCİ ÇUBUĞU */
        .admin-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; background: rgba(255,255,255,0.03); padding: 15px 20px; border-radius: 10px; border: 1px solid var(--card-border); }
        .btn-add { background: var(--success-color); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 1rem; }

        /* LİSTE YAPI */
        .products-list { display: flex; flex-direction: column; gap: 12px; }
        
        .product-row { 
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; 
            padding: 12px 20px; display: grid; 
            grid-template-columns: 100px 1.2fr 1fr 1fr 90px 90px 1.2fr 140px auto; 
            align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; 
        }
        .product-row:hover { border-color: var(--accent-yellow); transform: translateX(3px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
        
        .logo-box-container { width: 95px; height: 50px; background: #ffffff; padding: 4px; border-radius: 8px; border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .col-size { font-size: 1.25rem; font-weight: 800; color: #fff; }
        .col-brand { font-size: 1.05rem; color: var(--accent-yellow); font-weight: 800; text-transform: uppercase; }
        .col-pattern { font-size: 0.95rem; color: var(--text-main); font-weight: 600; }
        .col-season { display: inline-block; }
        .col-dot { display: inline-block; }
        .col-price { font-size: 1.25rem; font-weight: 800; color: var(--success-color); text-align: right; }
        
        .tag { font-size: 0.78rem; padding: 4px 8px; border-radius: 5px; background: #0f172a; color: var(--text-muted); border: 1px solid var(--card-border); font-weight: 600; text-align: center; }
        .tag-pattern { color: var(--accent-yellow); border-color: rgba(245, 158, 11, 0.3); }

        /* STOK ROZETLERİ */
        .stock-badge-in { background: rgba(16, 185, 129, 0.15); color: var(--success-color); border: 1.5px solid var(--success-color); font-weight: 800; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; }
        .stock-badge-out { background: rgba(239, 68, 68, 0.15); color: var(--danger-color); border: 1.5px solid var(--danger-color); font-weight: 800; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; }
        .stock-badge-admin { background: rgba(15, 23, 42, 0.8); color: var(--text-main); border: 1px solid var(--card-border); font-weight: 700; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; }

        .btn-icon { background: rgba(239, 68, 68, 0.15); color: var(--danger-color); border: 1px solid var(--danger-color); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-icon:hover { background: var(--danger-color); color: #fff; }

        /* MODALLAR */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: flex-start; z-index: 3000; padding: 20px; overflow-y: auto; }
        .modal-content { background: var(--card-bg); border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; border: 1px solid var(--card-border); margin: 30px auto; max-height: 85vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        
        /* DETAY MODALI */
        .detail-modal-content { max-width: 650px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; border: 2px solid var(--accent-yellow); }
        .detail-left { flex: 1; min-width: 220px; text-align: center; background: #ffffff; padding: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .detail-right { flex: 1.5; min-width: 250px; }
        .detail-right h2 { color: var(--accent-yellow); font-size: 1.6rem; margin-bottom: 15px; }
        .detail-info-row { font-size: 1.05rem; margin-bottom: 10px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .detail-info-row span:first-child { color: var(--text-muted); }
        .detail-info-row span:last-child { font-weight: bold; color: #fff; }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; width: 100%; }
        .modal-header h3 { color: var(--accent-yellow); font-size: 1.3rem; }
        .close-btn { font-size: 1.6rem; cursor: pointer; color: var(--text-muted); }

        .input-with-btn { display: flex; gap: 8px; }
        .btn-search-img { background: #3b82f6; color: white; border: none; padding: 0 14px; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }

        .hidden { display: none !important; }

        @media (max-width: 992px) {
            .product-row { grid-template-columns: 80px 1fr 1fr auto; gap: 10px; }
            .col-pattern, .col-season, .col-dot { display: none; }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="loginSection" class="login-wrapper">
        <div class="login-card">
            <h2><i class="fa-solid fa-lock"></i> Çelebi B2B Giriş</h2>
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" class="form-control" placeholder="admin veya bayi">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" class="form-control" placeholder="****">
            </div>
            <button class="btn-primary" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="header-title-area">
                <h1>ÇELEBİ OTO LASTİK</h1>
                <p>"Yolunuzda Güven, Lastiğinizde Kalite"</p>
            </div>
            <div id="userInfoArea" class="user-info hidden">
                <span>Giriş Yapan: <strong id="userBadge" class="user-badge">--</strong></span>
                <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div id="portalSection" class="main-container hidden">
        
        <!-- ARAMA VE FİLTRELEME -->
        <div class="controls-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Ebat, Marka veya Desen Ara... (Örn: 205/55, Petlas veya Snowmaster)">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setSeason('all', this)"><i class="fa-solid fa-border-all"></i> Tüm Ürünler</button>
                <button class="filter-btn" onclick="setSeason('Yaz', this)"><i class="fa-solid fa-sun"></i> Yaz Lastikleri</button>
                <button class="filter-btn" onclick="setSeason('Kış', this)"><i class="fa-solid fa-snowflake"></i> Kış Lastikleri</button>
                <button class="filter-btn" onclick="setSeason('4 Mevsim', this)"><i class="fa-solid fa-cloud-sun-rain"></i> 4 Mevsim</button>
            </div>
        </div>

        <!-- YÖNETİCİ ÇUBUĞU -->
        <div id="adminBar" class="admin-bar hidden">
            <h3 style="color: var(--text-muted); font-size: 1.1rem;"><i class="fa-solid fa-boxes-stacked"></i> Stok Yönetimi</h3>
            <div style="display: flex; gap: 10px;">
                <button class="btn-add" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Yeni Ürün Ekle</button>
                <button class="btn-add" style="background: #3b82f6;" onclick="openSettingsModal()"><i class="fa-solid fa-gear"></i> Ayarlar / Şifreler</button>
            </div>
        </div>

        <!-- STOK LİSTESİ -->
        <div id="productsGrid" class="products-list">
            <!-- Ürünler buraya listelenecek -->
        </div>

    </div>

    <!-- ÜRÜN DETAY MODALI -->
    <div id="detailModal" class="modal">
        <div class="modal-content detail-modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-circle-info"></i> Ürün Detayları</h3>
                <span class="close-btn" onclick="closeModal('detailModal')">&times;</span>
            </div>
            <div class="detail-left" id="detImgContainer">
                <!-- Vektör Logo veya Resim Yüklenecek -->
            </div>
            <div class="detail-right">
                <h2 id="detBrand">--</h2>
                <div class="detail-info-row"><span>Ebat:</span> <span id="detSize">--</span></div>
                <div class="detail-info-row"><span>Desen / Model:</span> <span id="detPattern" style="color: var(--accent-yellow);">--</span></div>
                <div class="detail-info-row"><span>Mevsim:</span> <span id="detSeason">--</span></div>
                <div class="detail-info-row"><span>DOT (Yıl):</span> <span id="detDot">--</span></div>
                <div class="detail-info-row"><span>Stok Durumu:</span> <span id="detStock">--</span></div>
                <div class="detail-info-row"><span>Birim Fiyat:</span> <span id="detPrice" style="color: var(--accent-yellow);">--</span></div>
            </div>
        </div>
    </div>

    <!-- YENİ ÜRÜN EKLEME MODALI -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-plus-circle"></i> Yeni Ürün Ekle</h3>
                <span class="close-btn" onclick="closeModal('productModal')">&times;</span>
            </div>

            <div class="form-group">
                <label>Ebat Seçin veya Yazın</label>
                <select id="pSizeSelect" class="form-control" onchange="checkCustomSize(this)">
                    <option value="175/65R14">175/65R14</option>
                    <option value="185/65R15">185/65R15</option>
                    <option value="195/65R15">195/65R15</option>
                    <option value="205/55R16" selected>205/55R16</option>
                    <option value="215/55R17">215/55R17</option>
                    <option value="225/45R17">225/45R17</option>
                    <option value="225/55R17">225/55R17</option>
                    <option value="235/60R18">235/60R18</option>
                    <option value="Diger">Diğer (Manuel Ebat Yaz)</option>
                </select>
            </div>
            <div class="form-group hidden" id="customSizeGroup">
                <label>Özel Ebat Girin</label>
                <input type="text" id="pCustomSize" class="form-control" placeholder="Örn: 245/40R19">
            </div>
            
            <div class="form-group">
                <label>Marka Seçin veya Yazın</label>
                <select id="pBrandSelect" class="form-control" onchange="checkCustomBrand(this)">
                    <option value="Petlas">Petlas</option>
                    <option value="Lassa">Lassa</option>
                    <option value="Bridgestone">Bridgestone</option>
                    <option value="Michelin">Michelin</option>
                    <option value="Goodyear">Goodyear</option>
                    <option value="Starmaxx">Starmaxx</option>
                    <option value="Hankook">Hankook</option>
                    <option value="Pirelli">Pirelli</option>
                    <option value="Kumho">Kumho</option>
                    <option value="Yokohama">Yokohama</option>
                    <option value="Continental">Continental</option>
                    <option value="Diger">Diğer (Manuel Yaz)</option>
                </select>
            </div>
            <div class="form-group hidden" id="customBrandGroup">
                <label>Özel Marka Adı</label>
                <input type="text" id="pCustomBrand" class="form-control" placeholder="Örn: Orium">
            </div>

            <div class="form-group">
                <label>Lastik Deseni / Modeli</label>
                <input type="text" id="pPattern" class="form-control" placeholder="Örn: Snowmaster 2, Greenways, Eagle F1">
            </div>

            <div class="form-group">
                <label>Mevsim</label>
                <select id="pSeason" class="form-control">
                    <option value="Yaz">Yaz</option>
                    <option value="Kış">Kış</option>
                    <option value="4 Mevsim">4 Mevsim</option>
                </select>
            </div>

            <div class="form-group">
                <label>DOT (Üretim Yılı)</label>
                <input type="text" id="pDot" class="form-control" placeholder="Örn: 2026">
            </div>

            <div class="form-group">
                <label>Görsel URL (İsteğe Bağlı Resim Linki)</label>
                <div class="input-with-btn">
                    <input type="text" id="pImg" class="form-control" placeholder="Resim linki yapıştırın veya boş bırakın">
                    <button type="button" class="btn-search-img" onclick="searchTireImage()"><i class="fa-solid fa-magnifying-glass"></i> Görsel Ara</button>
                </div>
            </div>

            <div class="form-group">
                <label>Fiyat (TL)</label>
                <input type="text" id="pPrice" class="form-control" placeholder="Örn: 3456.24" oninput="formatPriceInput(this)">
            </div>

            <div class="form-group">
                <label>Stok Adedi</label>
                <input type="number" id="pStock" class="form-control" placeholder="Örn: 12">
            </div>

            <button class="btn-primary" style="background: var(--success-color); color: white;" onclick="saveProduct()"><i class="fa-solid fa-check"></i> Ürünü Kaydet</button>
        </div>
    </div>

    <!-- AYARLAR MODALI -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-gear"></i> Yönetici Ayarları</h3>
                <span class="close-btn" onclick="closeModal('settingsModal')">&times;</span>
            </div>
            <div class="form-group">
                <label>Admin Şifresi</label>
                <input type="text" id="cfgAdminPass" class="form-control">
            </div>
            <div class="form-group">
                <label>Bayi Kullanıcı Adı</label>
                <input type="text" id="cfgBayiUser" class="form-control">
            </div>
            <div class="form-group">
                <label>Bayi Şifresi</label>
                <input type="text" id="cfgBayiPass" class="form-control">
            </div>
            <button class="btn-primary" style="background: #3b82f6; color: white;" onclick="saveSettings()"><i class="fa-solid fa-floppy-disk"></i> Ayarları Kaydet</button>
        </div>
    </div>

    <script>
        // KONTROL VE KESİN ÇALIŞAN SAF KOD/SVG MARKA LOGOLARI (DIŞ RESME BAĞIMSIZ)
        function renderBrandLogoSvg(brand) {
            let b = brand ? brand.toLowerCase().trim() : '';
            if (b.includes('petlas')) {
                return `<svg viewBox="0 0 160 50" style="width:100%; height:100%;"><rect width="100%" height="100%" fill="#ffffff"/><text x="50%" y="65%" font-family="'Impact', sans-serif" font-size="28" font-style="italic" fill="#dc2626" text-anchor="middle">PETLAS</text></svg>`;
            } else if (b.includes('lassa')) {
                return `<svg viewBox="0 0 160 50" style="width:100%; height:100%;"><rect width="100%" height="100%" fill="#ffffff"/><text x="50%" y="65%" font-family="'Arial Black', sans-serif" font-size="26" font-style="italic" fill="#dc2626" text-anchor="middle">LASSA</text></svg>`;
            } else if (b.includes('bridgestone')) {
                return `<svg viewBox="0 0 160 50" style="width:100%; height:100%;"><rect width="100%" height="100%" fill="#ffffff"/><text x="50%" y="65%" font-family="'Arial Black', sans-serif" font-size="18" fill="#111" text-anchor="middle"><tspan fill="#dc2626">B</tspan>RIDGESTONE</text></svg>`;
            } else if (b.includes('michelin')) {
                return `<svg viewBox="0 0 160 50" style="width:100%; height:100%;"><rect width="100%" height="100%" fill="#00205b"/><text x="50%" y="65%" font-family="'Arial Black', sans-serif" font-size="22" font-style="italic" fill="#facc15" text-anchor="middle">MICHELIN</text></svg>`;
            } else if (b.includes('goodyear')) {
                return `<svg viewBox="0 0 160 50" style="width:100%; height:100%;"><rect width="100%" height="100%" fill="#002868"/><text x="50%" y="65%" font-family="'Impact', sans-serif" font-size="24" font-style="italic" fill="#ffd100" text-anchor="middle">GOODYEAR</text></svg>`;
            } else if (b.includes('starmaxx')) {
                return `<svg viewBox="0 0 160 50" style="width:100%; height:100%;"><rect width="100%" height="100%" fill="#ffffff"/><text x="50%" y="65%" font-family="'Impact', sans-serif" font-size="24" font-style="italic" fill="#f59e0b" text-anchor="middle">STARMAXX</text></svg>`;
            } else if (b.includes('pirelli')) {
                return `<svg viewBox="0 0 160 50" style="width:100%; height:100%;"><rect width="100%" height="100%" fill="#ffd100"/><text x="50%" y="65%" font-family="'Arial Black', sans-serif" font-size="26" fill="#dc2626" text-anchor="middle">PIRELLI</text></svg>`;
            } else if (b.includes('continental')) {
                return `<svg viewBox="0 0 160 50" style="width:100%; height:100%;"><rect width="100%" height="100%" fill="#ffa000"/><text x="50%" y="65%" font-family="'Arial Black', sans-serif" font-size="18" fill="#000000" text-anchor="middle">Continental</text></svg>`;
            } else {
                return `<svg viewBox="0 0 160 50" style="width:100%; height:100%;"><rect width="100%" height="100%" fill="#0f172a"/><text x="50%" y="65%" font-family="'Arial Black', sans-serif" font-size="20" fill="#f59e0b" text-anchor="middle">${brand.toUpperCase()}</text></svg>`;
            }
        }

        const DEFAULT_TIRE_IMG = "https://images.unsplash.com/photo-1578844251758-2f71da64c96f?w=300&auto=format&fit=crop&q=80";

        let config = JSON.parse(localStorage.getItem('celebi_config')) || {
            adminUser: 'admin',
            adminPass: '1234',
            bayiUser: 'bayi',
            bayiPass: '1234'
        };

        let products = JSON.parse(localStorage.getItem('celebi_products')) || [
            { id: 1, brand: 'Petlas', pattern: 'Snowmaster 2', size: '205/55R16', season: 'Kış', dot: '2026', price: 3456.24, stock: 12, img: '' },
            { id: 2, brand: 'Lassa', pattern: 'Greenways', size: '205/55R16', season: 'Yaz', dot: '2026', price: 3100.00, stock: 8, img: '' }
        ];

        let currentUser = null;
        let selectedSeason = 'all';

        function formatPrice(val) {
            let num = Number(val);
            if (isNaN(num)) return '₺0.00';
            let parts = num.toFixed(2).split('.');
            let integerPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return '₺' + integerPart + '.' + parts[1];
        }

        function formatPriceInput(input) {
            input.value = input.value.replace(/[^0-9.]/g, '');
        }

        function searchTireImage() {
            let sizeSelect = document.getElementById('pSizeSelect').value;
            let size = sizeSelect === 'Diger' ? document.getElementById('pCustomSize').value.trim() : sizeSelect;

            let brandSelect = document.getElementById('pBrandSelect').value;
            let brand = brandSelect === 'Diger' ? document.getElementById('pCustomBrand').value.trim() : brandSelect;

            let pattern = document.getElementById('pPattern').value.trim();

            let query = `${brand} ${size} ${pattern} lastik`.trim();
            let searchUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(query)}`;
            window.open(searchUrl, '_blank');
        }

        function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if (u === config.adminUser && p === config.adminPass) {
                currentUser = { role: 'admin', name: 'Yönetici' };
            } else if (u === config.bayiUser && p === config.bayiPass) {
                currentUser = { role: 'bayi', name: config.bayiUser };
            } else {
                alert('Kullanıcı adı veya şifre hatalı!');
                return;
            }

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('portalSection').classList.remove('hidden');
            document.getElementById('userInfoArea').classList.remove('hidden');
            document.getElementById('userBadge').innerText = currentUser.name;

            if (currentUser.role === 'admin') {
                document.getElementById('adminBar').classList.remove('hidden');
            } else {
                document.getElementById('adminBar').classList.add('hidden');
            }

            renderProducts();
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('portalSection').classList.add('hidden');
            document.getElementById('userInfoArea').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function setSeason(season, btn) {
            selectedSeason = season;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function checkCustomBrand(select) {
            const customGroup = document.getElementById('customBrandGroup');
            if (select.value === 'Diger') {
                customGroup.classList.remove('hidden');
            } else {
                customGroup.classList.add('hidden');
            }
        }

        function checkCustomSize(select) {
            const customGroup = document.getElementById('customSizeGroup');
            if (select.value === 'Diger') {
                customGroup.classList.remove('hidden');
            } else {
                customGroup.classList.add('hidden');
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const patternStr = p.pattern ? p.pattern.toLowerCase() : '';
                const matchSearch = p.brand.toLowerCase().includes(search) || p.size.toLowerCase().includes(search) || patternStr.includes(search);
                const matchSeason = selectedSeason === 'all' || p.season === selectedSeason;
                return matchSearch && matchSeason;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px;">Aranan kriterlere uygun ürün bulunamadı.</p>';
                return;
            }

            filtered.forEach(p => {
                const row = document.createElement('div');
                row.className = 'product-row';
                
                // LOGO HTML/SVG ALANI
                let logoContent = p.img && p.img.trim() !== '' 
                    ? `<img src="${p.img}" class="product-img" alt="${p.brand}" onerror="this.parentElement.innerHTML=\`${renderBrandLogoSvg(p.brand)}\`;">`
                    : renderBrandLogoSvg(p.brand);
                
                row.onclick = () => openDetailModal(p);

                let stockHtml = '';
                if (currentUser.role === 'admin') {
                    stockHtml = `<div class="stock-badge-admin"><i class="fa-solid fa-boxes-stacked"></i> ${p.stock} Adet</div>`;
                } else {
                    if (Number(p.stock) > 0) {
                        stockHtml = `<div class="stock-badge-in"><i class="fa-solid fa-circle-check"></i> STOKTA VAR</div>`;
                    } else {
                        stockHtml = `<div class="stock-badge-out"><i class="fa-solid fa-circle-xmark"></i> REZERVE STOK</div>`;
                    }
                }

                row.innerHTML = `
                    <div class="logo-box-container">
                        ${logoContent}
                    </div>
                    <div class="col-size">${p.size}</div>
                    <div class="col-brand">${p.brand}</div>
                    <div class="col-pattern">${p.pattern ? `<span class="tag tag-pattern"><i class="fa-solid fa-grip"></i> ${p.pattern}</span>` : '-'}</div>
                    <div class="col-season"><span class="tag">${p.season}</span></div>
                    <div class="col-dot"><span class="tag">DOT ${p.dot}</span></div>
                    <div class="col-price">${formatPrice(p.price)}</div>
                    <div>${stockHtml}</div>
                    ${currentUser.role === 'admin' ? `
                        <div>
                            <button class="btn-icon" onclick="event.stopPropagation(); deleteProduct(${p.id})" title="Ürünü Sil"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    ` : '<div></div>'}
                `;
                grid.appendChild(row);
            });
        }

        function openDetailModal(p) {
            let detImgBox = document.getElementById('detImgContainer');
            if (p.img && p.img.trim() !== '') {
                detImgBox.innerHTML = `<img src="${p.img}" style="max-width:100%; max-height:200px; object-fit:contain;" alt="Lastik">`;
            } else {
                detImgBox.innerHTML = `<div style="width:200px; height:100px;">${renderBrandLogoSvg(p.brand)}</div>`;
            }

            document.getElementById('detBrand').innerText = p.brand;
            document.getElementById('detSize').innerText = p.size;
            document.getElementById('detPattern').innerText = p.pattern ? p.pattern : '--';
            document.getElementById('detSeason').innerText = p.season;
            document.getElementById('detDot').innerText = p.dot;
            
            let detStockElem = document.getElementById('detStock');
            if (currentUser.role === 'admin') {
                detStockElem.innerText = p.stock + " Adet";
                detStockElem.style.color = "var(--text-main)";
            } else {
                if (Number(p.stock) > 0) {
                    detStockElem.innerText = "STOKTA VAR";
                    detStockElem.style.color = "var(--success-color)";
                } else {
                    detStockElem.innerText = "REZERVE STOK";
                    detStockElem.style.color = "var(--danger-color)";
                }
            }

            document.getElementById('detPrice').innerText = formatPrice(p.price);
            document.getElementById('detailModal').style.display = 'flex';
        }

        function openAddModal() { document.getElementById('productModal').style.display = 'flex'; }
        function openSettingsModal() { 
            document.getElementById('cfgAdminPass').value = config.adminPass;
            document.getElementById('cfgBayiUser').value = config.bayiUser;
            document.getElementById('cfgBayiPass').value = config.bayiPass;
            document.getElementById('settingsModal').style.display = 'flex'; 
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function saveProduct() {
            let sizeSelect = document.getElementById('pSizeSelect').value;
            let size = sizeSelect === 'Diger' ? document.getElementById('pCustomSize').value.trim() : sizeSelect;

            let brandSelect = document.getElementById('pBrandSelect').value;
            let brand = brandSelect === 'Diger' ? document.getElementById('pCustomBrand').value.trim() : brandSelect;

            let pattern = document.getElementById('pPattern').value.trim();
            const season = document.getElementById('pSeason').value;
            const dot = document.getElementById('pDot').value;
            const img = document.getElementById('pImg').value;
            const price = document.getElementById('pPrice').value;
            const stock = document.getElementById('pStock').value;

            if(!brand || !size || !price || stock === '') { alert('Lütfen zorunlu alanları doldurun!'); return; }

            products.push({ id: Date.now(), brand, pattern, size, season, dot, img, price: Number(price), stock: Number(stock) });
            localStorage.setItem('celebi_products', JSON.stringify(products));
            closeModal('productModal');
            renderProducts();
        }

        function deleteProduct(id) {
            if(confirm('Bu ürünü silmek istediğinize emin misiniz?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('celebi_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function saveSettings() {
            config.adminPass = document.getElementById('cfgAdminPass').value;
            config.bayiUser = document.getElementById('cfgBayiUser').value;
            config.bayiPass = document.getElementById('cfgBayiPass').value;
            localStorage.setItem('celebi_config', JSON.stringify(config));
            alert('Ayarlar kaydedildi!');
            closeModal('settingsModal');
        }
    </script>
</body>
</html>
